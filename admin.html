<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Activar placas · Toca y Califica</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#1f1f1f;--soft:#5f6368;--line:#e3e5e8;--blue:#1a73e8;--green:#188038;--red:#d93025}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:520px;margin:0 auto;padding:16px 16px 48px}
  h1{font-size:22px;margin:8px 0 2px}
  .sub{color:var(--soft);margin:0 0 16px;font-size:14px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
  input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:84px;resize:vertical}
  .row{display:flex;gap:8px;margin-top:12px}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 14px;cursor:pointer}
  .pri{background:var(--blue);color:#fff;flex:1}
  .sec{background:#e8f0fe;color:var(--blue)}
  .ghost{background:transparent;color:var(--soft);padding:8px 0}
  .msg{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:10px;display:none;word-break:break-all}
  .ok{display:block;background:#e6f4ea;color:var(--green)}
  .err{display:block;background:#fce8e6;color:var(--red)}
  .info{display:block;background:#e8f0fe;color:#174ea6}
  .nfc{margin-top:10px;display:flex;gap:8px;align-items:center}
  .nfc code{flex:1;background:#f1f3f4;padding:10px;border-radius:8px;font-size:13px;word-break:break-all}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  li:first-child{border-top:0}
  li b{min-width:48px}
  li span{flex:1;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .on{color:var(--green)!important}
  .stars{color:#fbbc05;letter-spacing:2px}
  details summary{cursor:pointer;color:var(--soft);font-size:14px}
</style></head>
<body><main>
  <div class="stars">★★★★★</div>
  <h1>Activar placas</h1>
  <p class="sub">Toca y Califica · pega el enlace del negocio y elige la placa.</p>

  <section class="card" id="tokCard">
    <label for="tok">Clave de GitHub (solo la primera vez)</label>
    <input id="tok" type="password" autocomplete="off" placeholder="github_pat_…">
    <div class="row"><button class="pri" id="saveTok">Guardar clave</button></div>
    <p class="sub" style="margin:10px 0 0">Se guarda solo en este celular. Cómo crearla: ver la guía.</p>
  </section>

  <section class="card">
    <label for="link">Enlace de Google Maps del negocio</label>
    <textarea id="link" placeholder="https://www.google.com/maps/place/…"></textarea>
    <label for="code" style="margin-top:12px">Placa</label>
    <select id="code"></select>
    <label for="name" style="margin-top:12px">Nombre del negocio (para acordarte)</label>
    <input id="name" placeholder="Se llena solo si el enlace lo trae">
    <div class="row">
      <button class="pri" id="go">Activar placa</button>
      <button class="sec" id="test">Probar</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="nfc" id="nfcBox" style="display:none"><code id="nfc"></code><button class="sec" id="copy">Copiar</button></div>
  </section>

  <section class="card">
    <label>Placas</label>
    <ul id="list"><li><span>Cargando…</span></li></ul>
    <div class="row"><button class="ghost" id="reload">Actualizar lista</button><button class="ghost" id="off" style="margin-left:auto">Desactivar placa elegida</button></div>
  </section>

  <details class="card"><summary>Cambiar o borrar la clave</summary>
    <div class="row"><button class="sec" id="forget">Borrar clave de este celular</button></div>
  </details>
</main>
<script>
const REPO = "tocaycalifica-co/tocaycalifica-co.github.io", FILE = "codigos.js", SITE = "https://tocaycalifica-co.github.io/";
const $ = id => document.getElementById(id);
const store = { get(){ try { return localStorage.getItem("tyc_tok") || ""; } catch(e){ return ""; } },
                set(v){ try { localStorage.setItem("tyc_tok", v); } catch(e){} },
                del(){ try { localStorage.removeItem("tyc_tok"); } catch(e){} } };
let codes = {}, raw = "", sha = "";

function show(text, kind){ const m = $("msg"); m.className = "msg " + kind; m.textContent = text; }
function syncTok(){ $("tokCard").style.display = store.get() ? "none" : "block"; }

// --- enlace de reseña a partir del enlace de Maps ---
function le64(hex){ let n = BigInt(hex), out = []; for (let i = 0; i < 8; i++){ out.push(Number(n & 255n)); n >>= 8n; } return out; }
function placeId(a, b){
  const inner = [0x09, ...le64(a), 0x11, ...le64(b)];
  const bytes = [0x0a, inner.length, ...inner];
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function reviewLink(txt){
  txt = txt.trim();
  let m = txt.match(/https?:\/\/[^\s]*(g\.page\/r\/[^\s]+\/review|writereview\?placeid=[^\s&]+)[^\s]*/i);
  if (m) return { url: m[0] };
  m = txt.match(/placeid=(ChIJ[\w-]+)/) || txt.match(/\b(ChIJ[\w-]{10,})\b/);
  if (m) return { url: "https://search.google.com/local/writereview?placeid=" + m[1] };
  let d = decodeURIComponent(txt);
  m = d.match(/(0x[0-9a-f]{6,16}):(0x[0-9a-f]{6,16})/i);
  if (m) return { url: "https://search.google.com/local/writereview?placeid=" + placeId(m[1], m[2]), name: nameFrom(d) };
  if (/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(txt))
    return { err: "Ese es un enlace corto. Ábrelo en el navegador (no en la app de Maps), espera a que cargue el negocio y copia el enlace largo de la barra de direcciones." };
  return { err: "No encontré el negocio en ese enlace. Abre el negocio en Google Maps desde el navegador y copia el enlace completo." };
}
function nameFrom(d){ const m = d.match(/\/place\/([^/@]+)/); return m ? m[1].replace(/\+/g, " ").trim() : ""; }

// --- GitHub ---
async function gh(method, body){
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
    method, cache: "no-store",
    headers: { "Authorization": "Bearer " + store.get(), "Accept": "application/vnd.github+json" },
    body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? "La clave de GitHub no sirve o no tiene permiso. Revísala." : "GitHub respondió " + r.status);
  return r.json();
}
const dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));
const enc = s => { const b = new TextEncoder().encode(s); let t = ""; b.forEach(x => t += String.fromCharCode(x)); return btoa(t); };

async function load(){
  if (!store.get()){ $("list").innerHTML = "<li><span>Guarda la clave para ver las placas.</span></li>"; return; }
  try {
    const j = await gh("GET"); raw = dec(j.content); sha = j.sha; codes = {};
    raw.split("\n").forEach(l => { const m = l.match(/^\s*"(\w+)":\s*"([^"]*)",?\s*(?:\/\/\s*(.*))?$/); if (m) codes[m[1]] = { url: m[2], note: (m[3] || "").trim() }; });
    const sel = $("code"), cur = sel.value; sel.innerHTML = "";
    Object.keys(codes).filter(c => c !== "DEMO").forEach(c => {
      const o = document.createElement("option"); o.value = c;
      o.textContent = c + (codes[c].url ? " · " + (codes[c].note || "activa") : " · libre"); sel.appendChild(o); });
    if (cur && codes[cur]) sel.value = cur; else { const free = Object.keys(codes).find(c => c !== "DEMO" && !codes[c].url); if (free) sel.value = free; }
    $("list").innerHTML = Object.keys(codes).filter(c => c !== "DEMO").map(c =>
      `<li><b>${c}</b><span class="${codes[c].url ? "on" : ""}">${codes[c].url ? (codes[c].note || "activa").replace(/</g, "&lt;") : "libre"}</span></li>`).join("");
  } catch(e){ $("list").innerHTML = `<li><span>${e.message}</span></li>`; }
}

async function write(code, url, note, done){
  await load();
  if (!codes[code]) throw new Error("No encontré la placa " + code + " en la lista.");
  const re = new RegExp(`^(\\s*)"${code}":.*$`, "m");
  const safe = (note || "").replace(/[\r\n]/g, " ").trim();
  const line = `$1"${code}": "${url}",` + (url && safe ? " // " + safe : "");
  const nuevo = raw.replace(re, line);
  await gh("PUT", { message: (url ? "Activar " : "Desactivar ") + code + (safe ? " - " + safe : ""), content: enc(nuevo), sha });
  await load(); done();
}

$("link").addEventListener("input", () => { const r = reviewLink($("link").value); if (r.name && !$("name").value) $("name").value = r.name; });
$("saveTok").onclick = () => { const v = $("tok").value.trim(); if (!v){ show("Pega la clave primero.", "err"); return; } store.set(v); $("tok").value = ""; syncTok(); load(); };
$("forget").onclick = () => { store.del(); syncTok(); load(); show("Clave borrada de este celular.", "info"); };
$("reload").onclick = load;
$("test").onclick = () => { const r = reviewLink($("link").value); if (r.err){ show(r.err, "err"); return; } window.open(r.url, "_blank"); };
$("copy").onclick = () => { navigator.clipboard && navigator.clipboard.writeText($("nfc").textContent); $("copy").textContent = "Copiado"; setTimeout(() => $("copy").textContent = "Copiar", 1500); };
$("go").onclick = async () => {
  if (!store.get()){ show("Primero guarda la clave de GitHub.", "err"); return; }
  const r = reviewLink($("link").value); if (r.err){ show(r.err, "err"); return; }
  const code = $("code").value; if (!code){ show("Elige una placa.", "err"); return; }
  if (codes[code] && codes[code].url && !confirm(`La ${code} ya está con "${codes[code].note || "otro negocio"}". ¿Cambiarla?`)) return;
  show("Guardando…", "info"); $("go").disabled = true;
  try {
    await write(code, r.url, $("name").value, () => {
      show(`Listo: ${code} quedó con ${$("name").value || "el negocio"}. En 1 o 2 minutos ya funciona.`, "ok");
      $("nfc").textContent = SITE + code; $("nfcBox").style.display = "flex"; $("link").value = ""; $("name").value = "";
    });
  } catch(e){ show(e.message, "err"); }
  $("go").disabled = false;
};
$("off").onclick = async () => {
  const code = $("code").value; if (!code || !confirm(`¿Desactivar la ${code}?`)) return;
  show("Guardando…", "info");
  try { await write(code, "", "", () => show(`${code} quedó libre.`, "ok")); } catch(e){ show(e.message, "err"); }
};
syncTok(); load();
</script>
</body></html>
