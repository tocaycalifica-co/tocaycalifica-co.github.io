<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#1a73e8"><link rel="icon" href="/icon192.png"><link rel="apple-touch-icon" href="/icon192.png">
<title>Activar placas · Toca y Califica</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#1f1f1f;--soft:#5f6368;--line:#e3e5e8;--blue:#1a73e8;--green:#188038;--red:#d93025}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:520px;margin:0 auto;padding:16px 16px 48px}
  h1{font-size:22px;margin:8px 0 2px}
  .sub{color:var(--soft);margin:0 0 16px;font-size:14px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
  input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  textarea{min-height:84px;resize:vertical}
  .row{display:flex;gap:8px;margin-top:12px}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 14px;cursor:pointer}
  .pri{background:var(--blue);color:#fff;flex:1}
  .sec{background:#e8f0fe;color:var(--blue)}
  .ghost{background:transparent;color:var(--soft);padding:8px 0}
  .msg{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:10px;display:none;word-break:break-all}
  .ok{display:block;background:#e6f4ea;color:var(--green)}
  .err{display:block;background:#fce8e6;color:var(--red)}
  .info{display:block;background:#e8f0fe;color:#174ea6}
  .nfc{margin-top:10px;display:flex;gap:8px;align-items:center}
  .nfc code{flex:1;background:#f1f3f4;padding:10px;border-radius:8px;font-size:13px;word-break:break-all}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  li:first-child{border-top:0}
  li b{min-width:48px}
  li span{flex:1;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .on{color:var(--green)!important}
  .stars{color:#fbbc05;letter-spacing:2px}
  .seg{display:flex;background:#eef0f3;border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
  .seg button{flex:1;background:transparent;color:var(--soft);padding:10px 6px}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  h3{font-size:14px;margin:14px 0 2px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
  h3:first-child{margin-top:0}
  details summary{cursor:pointer;color:var(--soft);font-size:14px}
</style></head>
<body><main>
  <div class="stars">★★★★★</div>
  <h1>Activar placas</h1>
  <p class="sub">Toca y Califica · elige la placa y pega el enlace del negocio.</p>

  <section class="card" id="tokCard">
    <label for="tok">Clave de GitHub (solo la primera vez)</label>
    <input id="tok" type="password" autocomplete="off" placeholder="github_pat_…">
    <div class="row"><button class="pri" id="saveTok">Guardar clave</button></div>
    <p class="sub" style="margin:10px 0 0">Se guarda solo en este celular. Cómo crearla: ver la guía.</p>
  </section>

  <section class="card">
    <label>Producto</label>
    <div class="seg" id="prod"><button data-p="google" class="on">Google</button><button data-p="ig">Instagram</button><button data-p="tt">TikTok</button><button data-p="doble">Doble</button></div>
    <label>Tipo de placa</label>
    <div class="seg" id="tipo"><button data-t="0" class="on">Vinilo (madera)</button><button data-t="1">Económica</button></div>
    <label for="code">Placa</label>
    <select id="code"></select>
    <label for="link" id="linkLbl" style="margin-top:12px">Enlace de Google Maps del negocio</label>
    <textarea id="link"></textarea>
    <div id="link2Box" style="display:none"><label for="link2" style="margin-top:12px">Enlace o @usuario de TikTok</label>
      <textarea id="link2" placeholder="@tunegocio o https://www.tiktok.com/@tunegocio"></textarea></div>
    <label for="name" style="margin-top:12px">Nombre del negocio (para acordarte)</label>
    <input id="name" placeholder="Se llena solo si el enlace lo trae">
    <div class="row">
      <button class="pri" id="go">Activar placa</button>
      <button class="sec" id="test">Probar</button>
    </div>
    <div class="msg" id="msg"></div>
    <div id="nfcWrap"></div>
  </section>

  <section class="card">
    <label id="listLbl">Placas</label>
    <div id="list"><ul><li><span>Cargando…</span></li></ul></div>
    <div class="row"><button class="ghost" id="reload">Actualizar lista</button><button class="ghost" id="off" style="margin-left:auto">Desactivar placa elegida</button></div>
  </section>

  <details class="card"><summary>Cambiar o borrar la clave</summary>
    <div class="row"><button class="sec" id="forget">Borrar clave de este celular</button></div>
  </details>
</main>
<script>
const REPO = "tocaycalifica-co/tocaycalifica-co.github.io", FILE = "codigos.js", SITE = "https://tocaycalifica-co.github.io/";
const $ = id => document.getElementById(id);
const store = { get(){ try { return localStorage.getItem("tyc_tok") || ""; } catch(e){ return ""; } },
                set(v){ try { localStorage.setItem("tyc_tok", v); } catch(e){} },
                del(){ try { localStorage.removeItem("tyc_tok"); } catch(e){} } };
let codes = {}, raw = "", sha = "", prod = "google", tipo = 0;

// --- placas: los codigos impresos en el QR no cambian ---
const rango = (p, a, b, suf = "") => Array.from({ length: b - a + 1 }, (_, i) => p + String(a + i).padStart(3, "0") + suf);
const PRODUCTOS = {
  google: { nombre: "Google", grupos: [ [...rango("A", 1, 10), ...rango("A", 21, 30)], [...rango("A", 11, 20), ...rango("A", 31, 40)] ] },
  ig:     { nombre: "Instagram", grupos: [ rango("I", 1, 10), rango("I", 11, 20) ] },
  tt:     { nombre: "TikTok", grupos: [ rango("T", 1, 10), rango("T", 11, 20) ] },
  doble:  { nombre: "Doble", grupos: [ rango("D", 1, 10), rango("D", 11, 20) ] },  // cada placa: D001I (Instagram) + D001T (TikTok)
};
const TIPOS = ["Vinilo", "Económica"];
const claves = c => prod === "doble" ? [c + "I", c + "T"] : [c];
function buscar(c){ for (const p in PRODUCTOS) for (let t = 0; t < 2; t++){ const i = PRODUCTOS[p].grupos[t].indexOf(c); if (i >= 0) return { p, t, n: i + 1 }; } return null; }
const nombre = c => { const x = buscar(c); return x ? `${PRODUCTOS[x.p].nombre} ${TIPOS[x.t].toLowerCase()} placa ${x.n}` : c; };
const estado = c => { const ks = claves(c).map(k => codes[k]).filter(Boolean); const a = ks.find(k => k.url); return a ? (a.note || "activa") : ""; };

function show(text, kind){ const m = $("msg"); m.className = "msg " + kind; m.textContent = text; }
function syncTok(){ $("tokCard").style.display = store.get() ? "none" : "block"; }
function esc(t){ return t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

// --- enlace de reseña a partir del enlace de Maps ---
function le64(hex){ let n = BigInt(hex), out = []; for (let i = 0; i < 8; i++){ out.push(Number(n & 255n)); n >>= 8n; } return out; }
function placeId(a, b){
  const inner = [0x09, ...le64(a), 0x11, ...le64(b)];
  const bytes = [0x0a, inner.length, ...inner];
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function reviewLink(txt){
  txt = txt.trim();
  let m = txt.match(/https?:\/\/[^\s]*(g\.page\/r\/[^\s]+\/review|writereview\?placeid=[^\s&]+)[^\s]*/i);
  if (m) return { url: m[0] };
  m = txt.match(/placeid=(ChIJ[\w-]+)/) || txt.match(/\b(ChIJ[\w-]{10,})\b/);
  if (m) return { url: "https://search.google.com/local/writereview?placeid=" + m[1] };
  let d = decodeURIComponent(txt);
  m = d.match(/(0x[0-9a-f]{6,16}):(0x[0-9a-f]{6,16})/i);
  if (m) return { url: "https://search.google.com/local/writereview?placeid=" + placeId(m[1], m[2]), name: nameFrom(d) };
  m = d.match(/[?&](?:cid|ludocid)=(\d{5,20})/);
  if (m) return { url: "https://search.google.com/local/writereview?placeid=" + placeId("0", m[1]), name: nameFrom(d) };
  if (/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(txt))
    return { err: "Ese es un enlace corto. Ábrelo en el navegador (no en la app de Maps), espera a que cargue el negocio y copia el enlace largo de la barra de direcciones." };
  return { err: "No encontré el negocio en ese enlace. Abre el negocio en Google Maps desde el navegador y copia el enlace completo." };
}
function nameFrom(d){ const m = d.match(/\/place\/([^/@]+)/); return m ? m[1].replace(/\+/g, " ").trim() : ""; }
async function gh(method, body){
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`, {
    method, cache: "no-store",
    headers: { "Authorization": "Bearer " + store.get(), "Accept": "application/vnd.github+json" },
    body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(
    r.status === 401 ? "La clave no es válida (está mal copiada o se venció). Bórrala abajo y pega una nueva." :
    r.status === 403 ? "La clave no tiene permiso de escritura. Revisa que tenga Contents: Read and write, o apruébala en la organización." :
    r.status === 404 ? "La clave no tiene acceso al repositorio. En la clave, el Resource owner debe ser tocaycalifica-co y el repositorio tocaycalifica-co.github.io." :
    "GitHub respondió " + r.status);
  return r.json();
}
const dec = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0)));
const enc = s => { const b = new TextEncoder().encode(s); let t = ""; b.forEach(x => t += String.fromCharCode(x)); return btoa(t); };

// --- Instagram / TikTok ---
function redLink(red, txt){
  txt = txt.trim(); if (!txt) return { err: "Pega el enlace o el @usuario de " + (red === "ig" ? "Instagram." : "TikTok.") };
  const dom = red === "ig" ? "instagram.com" : "tiktok.com";
  let m = txt.match(/https?:\/\/[^\s]+/);
  if (m){ if (!m[0].includes(dom) && !(red === "tt" && /vm\.tiktok|vt\.tiktok/.test(m[0]))) return { err: "Ese enlace no es de " + (red === "ig" ? "Instagram." : "TikTok.") };
    const u = m[0].match(red === "ig" ? /instagram\.com\/([\w.]+)/ : /tiktok\.com\/@([\w.]+)/); return { url: m[0], name: u ? "@" + u[1] : "" }; }
  m = txt.match(/^@?([\w.]{2,30})$/);
  if (m) return { url: red === "ig" ? `https://www.instagram.com/${m[1]}/` : `https://www.tiktok.com/@${m[1]}`, name: "@" + m[1] };
  return { err: "Pega el enlace del perfil o el @usuario." };
}
function enlaces(){  // -> lista de [clave, url] para la placa elegida, o {err}
  const c = $("code").value; if (!c) return { err: "Elige una placa." };
  if (prod === "google"){ const r = reviewLink($("link").value); return r.err ? r : { pares: [[c, r.url]], name: r.name }; }
  if (prod === "ig" || prod === "tt"){ const r = redLink(prod, $("link").value); return r.err ? r : { pares: [[c, r.url]], name: r.name }; }
  const a = redLink("ig", $("link").value); if (a.err) return a;
  const b = redLink("tt", $("link2").value); if (b.err) return b;
  return { pares: [[c + "I", a.url], [c + "T", b.url]], name: a.name };
}

function parse(text){
  const out = {};
  text.split(/\r?\n/).forEach(l => { l = l.trim(); const m = l.match(/^\s*"(\w+)":\s*"([^"]*)",?\s*(?:\/\/\s*(.*))?$/); if (m) out[m[1]] = { url: m[2], note: (m[3] || "").trim() }; });
  return out;
}
function nfcShow(){
  const c = $("code").value, w = $("nfcWrap"); w.innerHTML = "";
  if (!c || tipo !== 0) return;  // las economicas no llevan NFC
  claves(c).forEach(k => {
    const lbl = prod === "doble" ? (k.endsWith("I") ? "NFC de Instagram" : "NFC de TikTok") : "Enlace para el NFC de esta placa";
    w.insertAdjacentHTML("beforeend", `<label style="margin-top:14px">${lbl}</label><div class="nfc"><code>${SITE + k}</code><button class="sec" data-copy="${SITE + k}">Copiar</button></div>`);
  });
  w.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copiado"; setTimeout(() => b.textContent = "Copiar", 1500); });
}
function form(){
  const L = { google: ["Enlace de Google Maps del negocio", "https://www.google.com/maps/place/…"],
              ig: ["Enlace o @usuario de Instagram", "@tunegocio o https://www.instagram.com/tunegocio"],
              tt: ["Enlace o @usuario de TikTok", "@tunegocio o https://www.tiktok.com/@tunegocio"],
              doble: ["Enlace o @usuario de Instagram", "@tunegocio o https://www.instagram.com/tunegocio"] }[prod];
  $("linkLbl").textContent = L[0]; $("link").placeholder = L[1];
  $("link2Box").style.display = prod === "doble" ? "block" : "none";
  $("test").style.display = prod === "doble" ? "none" : "";
}
function paint(){
  const sel = $("code"), cur = sel.value; sel.innerHTML = "";
  const list = PRODUCTOS[prod].grupos[tipo].filter(c => claves(c).every(k => codes[k]));
  list.forEach((c, i) => { const o = document.createElement("option"); o.value = c; const e = estado(c);
    o.textContent = "Placa " + (i + 1) + (e ? " · " + e : " · libre"); sel.appendChild(o); });
  if (cur && list.includes(cur)) sel.value = cur; else { const free = list.find(c => !estado(c)); if (free) sel.value = free; }
  nfcShow();
  $("listLbl").textContent = "Placas de " + PRODUCTOS[prod].nombre;
  $("list").innerHTML = PRODUCTOS[prod].grupos.map((g, t) => `<h3>${TIPOS[t]}</h3><ul>` + g.filter(c => claves(c).every(k => codes[k])).map((c, i) => {
    const e = estado(c); return `<li><b>Placa ${i + 1}</b><span class="${e ? "on" : ""}">${e ? esc(e) : "libre"}</span></li>`; }).join("")
    + "</ul>").join("") || "<ul><li><span>Aún no hay placas de este producto.</span></li></ul>";
}
async function load(){
  try { const r = await fetch(SITE + FILE + "?v=" + Date.now(), { cache: "no-store" }); codes = parse(await r.text()); paint(); }
  catch(e){ $("list").innerHTML = "<ul><li><span>No pude cargar las placas. Revisa el internet.</span></li></ul>"; }
}
async function loadForWrite(){ const j = await gh("GET"); raw = dec(j.content).replace(/\r\n/g, "\n"); sha = j.sha; codes = parse(raw); paint(); }
async function write(pares, note, msg){  // pares: [[clave, url], ...] en un solo guardado
  await loadForWrite();
  const safe = (note || "").replace(/[\r\n"]/g, " ").trim(); let nuevo = raw;
  for (const [k, url] of pares){
    if (!codes[k]) throw new Error("No encontré la placa " + k + " en la lista.");
    nuevo = nuevo.replace(new RegExp(`^(\\s*)"${k}":.*$`, "m"), `$1"${k}": "${url}",` + (url && safe ? " // " + safe : ""));
  }
  await gh("PUT", { message: msg + (safe ? " - " + safe : ""), content: enc(nuevo), sha });
  codes = parse(nuevo); paint();
}

document.querySelectorAll("#prod button").forEach(b => b.onclick = () => { prod = b.dataset.p;
  document.querySelectorAll("#prod button").forEach(x => x.classList.toggle("on", x === b)); $("code").value = ""; form(); paint(); });
document.querySelectorAll("#tipo button").forEach(b => b.onclick = () => { tipo = +b.dataset.t;
  document.querySelectorAll("#tipo button").forEach(x => x.classList.toggle("on", x === b)); $("code").value = ""; paint(); });
$("link").addEventListener("input", () => { const r = prod === "google" ? reviewLink($("link").value) : redLink(prod === "tt" ? "tt" : "ig", $("link").value); if (r.name && !$("name").value) $("name").value = r.name; });
$("saveTok").onclick = () => { const v = $("tok").value.trim(); if (!v){ show("Pega la clave primero.", "err"); return; }
  if (!/^(github_pat_|ghp_)\w{20,}$/.test(v)){ show("Eso no parece una clave de GitHub. Debe empezar por github_pat_ (mira la guía).", "err"); return; }
  store.set(v); $("tok").value = ""; syncTok(); load(); };
$("forget").onclick = () => { store.del(); syncTok(); show("Clave borrada de este celular.", "info"); };
$("reload").onclick = load;
$("code").onchange = nfcShow;
$("test").onclick = () => { const r = enlaces(); if (r.err){ show(r.err, "err"); return; } window.open(r.pares[0][1], "_blank"); };
$("go").onclick = async () => {
  if (!store.get()){ show("Primero guarda la clave de GitHub.", "err"); return; }
  const r = enlaces(); if (r.err){ show(r.err, "err"); return; }
  const c = $("code").value, e = estado(c);
  if (e && !confirm(`La ${nombre(c)} ya está con "${e}". ¿Cambiarla?`)) return;
  const note = $("name").value || r.name || "";
  show("Guardando…", "info"); $("go").disabled = true;
  try {
    await write(r.pares, note, "Activar " + nombre(c));
    show(`Listo: ${nombre(c)} quedó con ${note || "el negocio"}. En 1 o 2 minutos ya funciona.` + (tipo === 0 ? " Programa el NFC con el enlace de abajo." : ""), "ok");
    $("code").value = c; nfcShow(); $("link").value = ""; $("link2").value = ""; $("name").value = "";
  } catch(err){ show(err.message, "err"); }
  $("go").disabled = false;
};
$("off").onclick = async () => {
  const c = $("code").value; if (!c || !confirm(`¿Desactivar la ${nombre(c)}?`)) return;
  show("Guardando…", "info");
  try { await write(claves(c).map(k => [k, ""]), "", "Desactivar " + nombre(c)); show(`${nombre(c)} quedó libre.`, "ok"); } catch(e){ show(e.message, "err"); }
};
syncTok(); form(); load();
</script>
</body></html>
